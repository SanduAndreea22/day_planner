<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong | Emotional Planner</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #F5F1EB;
            color: #232824;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            max-width: 420px;
            margin: 2rem;
            padding: 2.5rem 2rem;
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 20px 40px rgba(0,0,0,.12);
            text-align: center;
        }
        h1 {
            font-size: 1.6rem;
            color: #343A35; font-family: Georgia, serif; font-weight: 500;
            margin-bottom: 0.5rem;
        }
        p { color: #6b7280; margin-bottom: 1.5rem; }
        a {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            border-radius: 14px;
            background: #5F6A5B;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover { background: #484f45; }
        @media (prefers-color-scheme: dark) {
            body { background-color: #232824; color: #f4f7fb; }
            .card { background: #2D332E; }
            p { color: #9ca3af; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Something went wrong on our side</h1>
        <p>This isn’t something you did. Please try again in a moment.</p>
        <a href="/">← Go to the home page</a>
    </div>
</body>
</html>
