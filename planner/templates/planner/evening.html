{% extends "base.html" %}

{% block title %}🌙 Evening Reflection · Emotional Planner{% endblock %}

{% block content %}
<div class="evening-card" id="evening-card" style="
    max-width:800px;
    margin:2rem auto;
    padding:2rem;
    border-radius:var(--radius-lg);
    background:var(--bg-card);
    box-shadow:var(--shadow);
    transition: background 0.5s, color 0.5s, opacity 0.7s ease, transform 0.7s ease;
">

    <div class="evening-moon" aria-hidden="true">🌙</div>

    <div class="evening-title" style="
        font-size:2rem;
        font-weight:700;
        text-align:center;
        margin-bottom:1rem;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: fadeInUp 0.8s ease forwards;
    ">
        🌙 Evening Reflection
    </div>

    <div class="evening-date muted" style="text-align:center; color:var(--text-muted); margin-bottom:1.5rem;">
        {{ day.date|date:"l, d F Y" }}
    </div>

    <div class="evening-intro" style="text-align:center; color:var(--text-muted); margin-bottom:2rem; font-style:italic;">
        Closing the day gently. No analysis, no pressure.
    </div>

    <form method="post" class="evening-form" id="evening-form" style="display:flex; flex-direction:column; gap:1.5rem;">
        {% csrf_token %}

        <input type="hidden" name="mood" value="{{ day.mood }}">
        <input type="hidden" name="color" value="{{ day.color }}">
        <input type="hidden" name="notes" value="{{ day.notes }}">

        <div class="evening-section" style="display:flex; flex-direction:column;">
            <label style="font-weight:600; margin-bottom:0.3rem;">🔋 What drained my energy today?</label>
            <textarea
                name="drain"
                rows="3"
                placeholder="Anything, even something small…"
                style="padding:0.5rem; border-radius:14px; border:1px solid #ccc; resize:none; transition: box-shadow 0.3s;"
            >{{ reflection.drain }}</textarea>
        </div>

        <div class="evening-section" style="display:flex; flex-direction:column;">
            <label style="font-weight:600; margin-bottom:0.3rem;">🌸 One small thing I can appreciate about myself today</label>
            <textarea
                name="small_win"
                rows="3"
                placeholder="A gesture, a thought, a break…"
                style="padding:0.5rem; border-radius:14px; border:1px solid #ccc; resize:none; transition: box-shadow 0.3s;"
            >{{ reflection.small_win }}</textarea>
        </div>

        <div class="evening-actions" style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; margin-top:1rem;">
            <button type="submit" class="button primary" style="
                padding:0.7rem 1.2rem;
                border-radius:14px;
                background:var(--primary);
                color:white;
                font-weight:600;
                flex:1;
                min-width:140px;
                transition: transform 0.2s, box-shadow 0.2s;
            ">
                Close the day 🌙
            </button>

            <a href="{% url 'day_detail' day.date.year day.date.month day.date.day %}" class="button" style="
                padding:0.7rem 1.2rem;
                border-radius:14px;
                background:var(--secondary);
                color:white;
                font-weight:600;
                flex:1;
                min-width:140px;
                text-align:center;
                text-decoration:none;
                transition: transform 0.2s, box-shadow 0.2s;
            ">
                Back to day
            </a>
        </div>
    </form>
</div>

<style>
/* fadeInUp and dark-mode textarea theming come from style.css — one shared
   definition, instead of a copy defined locally here. */
.evening-actions .button:hover {
    transform: scale(1.05);
}

.evening-moon {
    font-size: 2.2rem;
    text-align: center;
    margin-bottom: 0.3rem;
    animation: evening-breathe 4s ease-in-out infinite;
}
@keyframes evening-breathe {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.12); opacity: 1; }
}

/* Plays right before the form actually submits, so closing the day feels
   like a brief pause rather than an instant page jump. */
.evening-card.closing {
    opacity: 0;
    transform: scale(0.97);
}
.evening-card.closing .evening-moon {
    animation: evening-breathe 0.7s ease-in-out;
}
</style>

<script>
(function () {
    var card = document.getElementById('evening-card');
    var form = document.getElementById('evening-form');
    if (!form) return;

    form.addEventListener('submit', function (event) {
        if (card.classList.contains('closing')) return;
        event.preventDefault();
        card.classList.add('closing');
        window.setTimeout(function () { form.submit(); }, 650);
    });
})();
</script>
{% endblock %}
