{% extends "base.html" %}

{% block title %}✅ Password updated · Emotional Planner{% endblock %}

{% block content %}
<div class="auth-card">

    <h2 class="auth-title">✅ Password updated</h2>

    <p class="auth-subtitle muted">
        Your password has been changed. You can log in now.
    </p>

    <a href="{% url 'login' %}" class="auth-button" style="display:block; text-decoration:none; box-sizing:border-box;">
        Go to login
    </a>
</div>
{% endblock %}
