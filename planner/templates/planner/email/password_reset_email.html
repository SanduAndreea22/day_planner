<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset your password</title>
</head>
<body style="font-family: Inter, Arial, sans-serif; background:#f7f9f8; padding:24px;">

    <div style="
        max-width:520px;
        margin:auto;
        background:#ffffff;
        padding:32px;
        border-radius:16px;
        color:#2f3e46;
    ">

        <h2 style="margin-top:0;">🔑 Reset your password</h2>

        <p>
            You (or someone else) requested a password reset for your
            <strong>Emotional Planner</strong> account.
        </p>

        <p style="text-align:center; margin:24px 0;">
            <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
               style="
                   background:#7dd3a7;
                   color:#ffffff;
                   padding:12px 20px;
                   border-radius:12px;
                   text-decoration:none;
                   font-weight:500;
                   display:inline-block;
               ">
                Choose a new password
            </a>
        </p>

        <p style="font-size:0.9rem; color:#6b7280;">
            If you didn’t request this, you can safely ignore this email — your password won’t change.
        </p>

        <p style="margin-bottom:0;">
            With care,<br>
            <strong>Emotional Planner 🌱</strong>
        </p>

    </div>

</body>
</html>
