{# Line-art face for the five-step mood scale. Usage: {% include "planner/partials/mood_face.html" with mood=day.mood size=22 %} #}
{% if mood %}<svg class="mood-face" width="{{ size|default:22 }}" height="{{ size|default:22 }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9.5"/><circle cx="9" cy="10" r=".9" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r=".9" fill="currentColor" stroke="none"/>
{% if mood == "very_good" %}<path d="M7.8 13.6c1.2 3.6 7.2 3.6 8.4 0z"/>
{% elif mood == "good" %}<path d="M8.5 14.4c1.4 1.8 5.6 1.8 7 0"/>
{% elif mood == "neutral" %}<path d="M9 15.2h6"/>
{% elif mood == "bad" %}<path d="M8.5 16.4c1.4-1.8 5.6-1.8 7 0"/>
{% elif mood == "very_bad" %}<path d="M8 17c1.4-2.6 6.6-2.6 8 0"/><path d="M7.5 7.6l2.2.8M16.5 7.6l-2.2.8"/>{% endif %}</svg>{% endif %}
